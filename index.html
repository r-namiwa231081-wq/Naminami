<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ロイロノート・スタイル - クラウド学習キャンバス</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
    .bg-grid { background-size: 30px 30px; background-image: radial-gradient(circle, #cbd5e1 1.5px, transparent 1.5px); }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-100 flex flex-col text-slate-800">

  <!-- ヘッダーバー -->
  <header class="h-14 bg-blue-600 text-white flex items-center justify-between px-4 shadow-md shrink-0">
    <div class="flex items-center gap-3">
      <span class="font-bold text-lg"><i class="fa-solid fa-note-sticky text-yellow-300"></i> ロイロノート・シンプル</span>
      <!-- ロール切替 -->
      <div class="flex bg-blue-800 rounded-lg p-0.5 text-xs">
        <button id="btn-role-student" onclick="switchRole('student')" class="px-3 py-1 rounded bg-white text-blue-700 font-bold">児童・生徒</button>
        <button id="btn-role-teacher" onclick="switchRole('teacher')" class="px-3 py-1 rounded text-blue-200 hover:text-white font-bold">先生</button>
      </div>
    </div>

    <!-- 中央：提出・配付アクションボタン -->
    <div class="flex items-center gap-2">
      <!-- 児童用：提出 -->
      <button id="btn-submit" onclick="openSubmitModal()" class="bg-amber-500 hover:bg-amber-600 px-4 py-1.5 rounded-lg text-sm font-bold shadow">
        <i class="fa-solid fa-paper-plane"></i> 提出する
      </button>

      <!-- 先生用：全員へ配付 ＆ 管理画面 -->
      <button id="btn-distribute" onclick="distributeToAll()" class="hidden bg-indigo-500 hover:bg-indigo-600 px-3 py-1.5 rounded-lg text-xs font-bold shadow">
        <i class="fa-solid fa-share-nodes"></i> ③ 全員へ資料配信
      </button>
      <button id="btn-teacher-dash" onclick="openTeacherDash()" class="hidden bg-purple-600 hover:bg-purple-700 px-3 py-1.5 rounded-lg text-xs font-bold shadow">
        <i class="fa-solid fa-boxes-packing"></i> 教員管理 (提出箱・アカウント)
      </button>
    </div>

    <!-- 右側：ログイン表示 -->
    <div class="flex items-center gap-2 text-xs">
      <span id="user-display" class="font-bold bg-blue-800 px-3 py-1 rounded-lg">ログイン中: 児童 太郎</span>
      <button onclick="clearCanvas()" class="p-2 hover:bg-blue-700 rounded-lg" title="キャンバスクリア"><i class="fa-solid fa-trash-can"></i></button>
    </div>
  </header>

  <!-- メインエリア -->
  <div class="flex-1 flex overflow-hidden">
    <!-- 左サイドバー：② カード作成パレット -->
    <aside class="w-56 bg-white border-r border-slate-200 p-3 flex flex-col gap-2 shrink-0">
      <span class="text-xs font-bold text-slate-500">② カード作成</span>
